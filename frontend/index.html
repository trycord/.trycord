<!doctype html>
<html lang="en" data-theme="trycord">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Trycord - communities that own their communication, identity and data.">
  <title>Trycord</title>

  <!-- The hosted mount, for a front end deployed under a path. The server rewrites this
       per request because it is the only thing that knows where it is mounted; the same
       file is served from the origin root by a self-hoster. -->
  <base href="/app/">

  <link rel="icon" href="./assets/trycord-assets/app/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/trycord-assets/app/trycord-app-icon.svg">
  <link rel="manifest" href="./assets/trycord-assets/app/site.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trycord">
  <meta name="theme-color" content="#18191D">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <!-- One mount point. Anything the application builds beyond this exists in JavaScript,
       not in this document, so there is no second tree to disagree with the first. -->
  <div id="app"></div>

  <!-- Loaded before the application, and before it as a plain script with no imports: it
       has to be able to report a module graph that failed to load, so it cannot depend on
       that graph. -->
  <script src="./js/crash.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
