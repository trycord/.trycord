# Project-wide Gradle settings.

# JVM sizing. The React Native build needs more heap than the default.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.configureondemand=true

# AndroidX is required by React Native.
android.useAndroidX=true
android.enableJetifier=false

# The architectures a release build contains.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# The New Architecture, on by default since React Native 0.76.
newArchEnabled=true

# Hermes, the JavaScript engine.
hermesEnabled=true
