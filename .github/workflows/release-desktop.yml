# Trycord desktop release pipeline.
#
# Trigger: ONLY explicit version tags (v1.0.1, v1.2.0-beta.1, ...).
# Ordinary pushes, PRs, and merges NEVER publish a release.
#
# Flow per platform:
#   tag → install → build (never publishes) → validate artifacts
#       → publish → validate published update metadata.
# If validation fails at any point, the job FAILS and nothing (more)
# is published. A release is successful only when the published
# latest.yml is reachable and references the published installer.
#
# Required repository secret: GH_TOKEN (a token with `contents:write` /
# `repo` scope; the default GITHUB_TOKEN works for same-repo releases).
#
# Code signing (optional, recommended for production):
#   CSC_LINK         — base64-encoded certificate or path to .pfx
#   CSC_KEY_PASSWORD — certificate password
# macOS auto-updates REQUIRE a signed app; Windows signing is optional
# but recommended. When unset, builds are unsigned and still work for
# local install/testing.
name: Release desktop

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release-win:
    name: Build + publish (Windows NSIS)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: trycord-desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trycord-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (no publish)
        run: npm run build:win

      - name: Validate release artifacts (fail before publish if broken)
        run: npm run validate:release

      - name: Publish Windows installer
        run: npm run release -- --win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Validate published update metadata
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          echo "$ASSETS" | grep -q '\.exe$' || (echo 'missing installer asset' && exit 1)
          echo "$ASSETS" | grep -q '^latest\.yml$' || (echo 'missing latest.yml asset' && exit 1)
          echo "$ASSETS" | grep -q '\.blockmap$' || (echo 'missing blockmap asset' && exit 1)
          echo "published release $TAG carries installer + latest.yml + blockmap"

  release-linux:
    name: Build + publish (Linux AppImage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trycord-desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trycord-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage (no publish)
        run: npm run build:linux

      - name: Validate release artifacts (fail before publish if broken)
        run: npm run validate:release

      - name: Publish Linux AppImage
        run: npm run release -- --linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Validate published update metadata
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          echo "$ASSETS" | grep -q '\.AppImage$' || (echo 'missing AppImage asset' && exit 1)
          echo "$ASSETS" | grep -q '^latest-linux\.yml$' || (echo 'missing latest-linux.yml asset' && exit 1)
          echo "published release $TAG carries AppImage + latest-linux.yml"
