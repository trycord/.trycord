# Trycord check pipeline: install, syntax-check, schema smoke test.
#
# Runs on pushes and pull requests to main. Never publishes anything —
# releases are produced only by the release-desktop workflow on v* tags.
name: Check

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

# One run at a time, and a new push cancels the one it supersedes.
#
# The screenshots job photographs 27 surfaces at eight widths - 216 renders - and takes
# most of half an hour. Without this, three commits in quick succession leave three runs
# each doing all of it, none of them answering a question anyone is still asking, and the
# last one queued behind the two in front.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. Three of these jobs run
          # `npm run check`, which includes check-split-loses, and that check reads each
          # file as it was before it was split by revision - so on a shallow checkout all
          # eight `git show` calls throw and it verifies nothing at all. It used to report
          # that as a pass. It fails on zero comparisons now, which is right, and which
          # would otherwise turn three jobs red on their first run.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server sources
        run: node --check src/server.js && for f in $(find src scripts -name '*.js'); do node --check "$f" || exit 1; done

      - name: Schema smoke test (throwaway SQLite)
        run: npm run check

      # Which origins this instance answers. Security-relevant, and until now covered by
      # nothing: the flow check sends no Origin header at all, which is the one branch
      # that has no rules in it.
      - name: Origin policy
        run: npm run check:origins

      # Every theme's contrast ratios, and no colour written into a component rule.
      # Contrast is the part of accessibility that can be measured exactly rather than
      # judged by eye, and this is where it was measured for the first time.
      - name: Contrast
        run: npm run check:contrast

  flows:
    name: Flow checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. Three of these jobs run
          # `npm run check`, which includes check-split-loses, and that check reads each
          # file as it was before it was split by revision - so on a shallow checkout all
          # eight `git show` calls throw and it verifies nothing at all. It used to report
          # that as a pass. It fails on zero comparisons now, which is right, and which
          # would otherwise turn three jobs red on their first run.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install server dependencies
        working-directory: backend
        run: npm ci

      # The only job that runs the application. Everything else reads source: it parses
      # files, resolves imports and compares lists. This boots a real server on a
      # throwaway database and drives the flows a person performs - signing in, posting a
      # message, reacting, pinning, and trying to read somebody else's community - which
      # is the only way to catch a route that 404s or a permission that lets the wrong
      # person in.
      #
      # It needs the web client on disk to serve, because some of its assertions are
      # about what a browser gets back.
      - name: Flow checks
        working-directory: backend
        run: npm run check:flows

  render:
    name: Render checks (jsdom)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. Three of these jobs run
          # `npm run check`, which includes check-split-loses, and that check reads each
          # file as it was before it was split by revision - so on a shallow checkout all
          # eight `git show` calls throw and it verifies nothing at all. It used to report
          # that as a pass. It fails on zero comparisons now, which is right, and which
          # would otherwise turn three jobs red on their first run.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # jsdom is a devDependency, so npm ci brings it. It is deliberately not in
      # dependencies: nothing Trycord ships needs it. It is here so the client can be
      # rendered by something other than a browser.
      - name: Install server dependencies
        working-directory: backend
        run: npm ci

      # Every other job reads source. This one boots a real backend on a throwaway
      # database, loads the real index.html into jsdom, imports the real client modules
      # and visits every route in the registry the way a reader would - through the
      # router, with real seeded rows behind the :id segments.
      #
      # It exists because nothing else could see a page render. Chromium is installed
      # where this has run but never completes an http request there, so a page that
      # rendered nothing was only ever discoverable by reading the code that draws it.
      - name: Render every route
        working-directory: backend
        run: npm run check:render

      # Two accounts, two sockets, one message. Every other check drives HTTP, so
      # nothing else can tell "the event reached the sender" from "the event reached
      # the room" - and an event emitted to nobody looks identical to a working one
      # until two people are in the channel.
      - name: Realtime, with two clients
        working-directory: backend
        run: npm run check:realtime

      # The page contract and the navigation built from it: no field a page defines that
      # nothing reads, no nav entry pointing at a route no page claims, no page orphaned
      # from every way in. This is the check that stops the page registry growing a field
      # per conceivable concern, which is how one registry became four.
      - name: Page contract and navigation
        working-directory: backend
        run: npm run check:registry

  shots:
    name: Screenshots (real browser)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. Three of these jobs run
          # `npm run check`, which includes check-split-loses, and that check reads each
          # file as it was before it was split by revision - so on a shallow checkout all
          # eight `git show` calls throw and it verifies nothing at all. It used to report
          # that as a pass. It fails on zero comparisons now, which is right, and which
          # would otherwise turn three jobs red on their first run.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The comment that used to be here said no install was needed, because nothing in
      # scripts/browser/ imports a package - it speaks CDP over the browser's own
      # WebSocket. That is true of the driver and false of what runs it: shoot.js spawns
      # src/server.js and photographs a real application, so it needs the server's
      # dependencies. Without this step every push failed with `Cannot find module
      # 'dotenv'`, which reads as a broken product and is not one.
      - name: Install server dependencies
        working-directory: backend
        run: npm ci

      # The graph the server actually serves, over HTTP. Every other client check reads
      # files on disk; this one asks the server, because a specifier can resolve on disk
      # and still 404, which is a black screen rather than a failing test.
      - name: Client module graph over HTTP
        working-directory: backend
        run: npm run check:graph

      - name: Photograph every surface at eight widths
        working-directory: backend
        run: npm run check:shots

      # The screenshots are the point. This step uploads them whether or not the run
      # above skipped: a machine whose browser cannot load http photographs nothing,
      # and an artifact directory that is empty says so more clearly than a green tick.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: backend/shots
          if-no-files-found: warn

  client:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. Three of these jobs run
          # `npm run check`, which includes check-split-loses, and that check reads each
          # file as it was before it was split by revision - so on a shallow checkout all
          # eight `git show` calls throw and it verifies nothing at all. It used to report
          # that as a pass. It fails on zero comparisons now, which is right, and which
          # would otherwise turn three jobs red on their first run.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # NOT `node --check frontend/js/*.js`: that reports success for a
      # .js file containing import statements even when the body has a duplicate
      # declaration, so it is not a check. A duplicate `const serverId` shipped
      # to main through it in 44e1ba8. This parses each module as a module.
      - name: Parse client modules as ES modules
        run: node backend/scripts/check-client-modules.js frontend/js

      # Imports every client module, which is the only step that evaluates client code.
      # `export { esc, el } from './dom.js'` re-exports without binding a local name, so
      # every importer resolved, the file parsed, and the application still died on its
      # first line. Nothing that reads source can see that; importing the module can.
      - name: Load client modules against a stub DOM
        run: node backend/scripts/check-client-load.js


  desktop:
    name: Desktop checks (no install needed)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone. Three of these jobs run
          # `npm run check`, which includes check-split-loses, and that check reads each
          # file as it was before it was split by revision - so on a shallow checkout all
          # eight `git show` calls throw and it verifies nothing at all. It used to report
          # that as a pass. It fails on zero comparisons now, which is right, and which
          # would otherwise turn three jobs red on their first run.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same trap as the client job: these are CommonJS and node --check is
      # genuinely meaningful for them, but they are listed explicitly so a new
      # desktop script cannot skip the gate by being unlisted.
      - name: Syntax-check desktop sources
        run: for f in trycord-desktop/main.js trycord-desktop/updater.js trycord-desktop/preload.js trycord-desktop/launcher.js trycord-desktop/launcher-preload.js trycord-desktop/launcher-renderer.js trycord-desktop/scripts/*.js; do node --check "$f" || exit 1; done
        # The launcher renderer is loaded by <script src>, not require, so
        # node --check is the only thing that ever parses it. A missing file
        # would otherwise fail silently in a packaged build.
        env:
          LAUNCHER_HTML: trycord-desktop/launcher.html
      - name: Every file the launcher loads is listed
        run: |
          cd trycord-desktop
          for f in launcher.css launcher-renderer.js; do
            grep -q "$f" launcher.html || { echo "launcher.html does not reference $f"; exit 1; }
          done
          node -e "
            const pkg = require('./package.json');
            const files = pkg.build.files;
            for (const f of ['launcher.js','launcher-preload.js','launcher-renderer.js','launcher.html','launcher.css']) {
              if (!files.includes(f)) { console.error('not packaged: ' + f); process.exit(1); }
            }
            console.log('launcher files packaged');
          "

  # There was a 'browser' job here, and it could never have passed. It ran with
  # working-directory: tests/browser, and /tests/ is in .gitignore - local-only
  # development tooling - so that directory does not exist in a fresh clone and bash
  # fails before the first suite starts. It also named t-visual.mjs and t-origin.mjs,
  # which are not on disk.
  #
  # It went unnoticed because this file was itself untracked: nothing had ever run it.
  # A job that is always red is worse than no job, because it is the thing people
  # learn to ignore. Browser verification lives with the screenshot suite, on the
  # shots branch, where the scripts it needs are actually present.
