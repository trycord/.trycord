# Trycord check pipeline: install, syntax-check, schema smoke test.
#
# Runs on pushes and pull requests to main. Never publishes anything —
# releases are produced only by the release-desktop workflow on v* tags.
name: Check

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trycord-server
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trycord-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server sources
        run: node --check src/server.js && for f in $(find src scripts -name '*.js'); do node --check "$f" || exit 1; done

      - name: Schema smoke test (throwaway SQLite)
        run: npm run check

  client:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # NOT `node --check trycord-client/js/*.js`: that reports success for a
      # .js file containing import statements even when the body has a duplicate
      # declaration, so it is not a check. A duplicate `const serverId` shipped
      # to main through it in 44e1ba8. This parses each module as a module.
      - name: Parse client modules as ES modules
        run: node trycord-server/scripts/check-client-modules.js trycord-client/js

  desktop:
    name: Desktop checks (no install needed)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same trap as the client job: these are CommonJS and node --check is
      # genuinely meaningful for them, but they are listed explicitly so a new
      # desktop script cannot skip the gate by being unlisted.
      - name: Syntax-check desktop sources
        run: for f in trycord-desktop/main.js trycord-desktop/updater.js trycord-desktop/preload.js trycord-desktop/scripts/*.js; do node --check "$f" || exit 1; done

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trycord-server/package-lock.json

      # The server needs better-sqlite3, so this job installs the server's
      # dependencies even though it never starts anything the other jobs do not.
      # Without this it fails at boot on a missing module, which reads as a
      # product fault.
      - name: Install server dependencies
        working-directory: trycord-server
        run: npm ci

      # Ubuntu runners ship a chromium; the driver finds it without being told
      # where it is. A machine without one fails this job loudly rather than
      # silently skipping, because a skipped client check is how a sidebar row
      # that throws on every click gets in.
      - name: Confirm a browser is available
        run: (command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable)

      # SQLite on a throwaway file, so CI never needs a database service and can
      # never touch one. MAIL_MODE=log is not optional: without it the server
      # reads a local .env, turns on SMTP verification, and every account stays
      # unverified, which fails the suites for reasons that look like product
      # faults.
      - name: Start a server to test against
        env:
          DB_CLIENT: sqlite
          DB_FILE: /tmp/tc-ci.db
          PORT: '9975'
          HOST: 127.0.0.1
          UPLOAD_DIR: /tmp/tc-ci-uploads
          MAIL_MODE: log
          # Every instance must supply its own signing secret; the official one is
          # never shared and never defaulted. This is a throwaway value for a
          # throwaway database, generated here rather than pinned anywhere.
          JWT_SECRET: ci0123456789abcdef0123456789abcdef0123456789
          SERVER_HOST_TYPE: express
        run: |
          node trycord-server/src/server.js > /tmp/tc-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9975/api/health > /dev/null; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "server did not come up:"; cat /tmp/tc-server.log; exit 1

      - name: Run browser checks
        working-directory: tools/browser-checks
        # Each suite boots its own Chromium, so they are separate steps: a
        # crash in one reports against that suite rather than taking the rest
        # down with it.
        run: |
          node t-sidebar.mjs
          node t-visual.mjs
          node t-origin.mjs
