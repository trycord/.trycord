<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trycord</title>
  <style>
    /* The launcher's own colours, from the instance's token library. The
       launcher is a window of its own and loads no stylesheet from the
       network: a launcher that waits for a download to look right is a
       launcher that shows nothing when the network is down, which is exactly
       when it matters. */
    :root {
      color-scheme: dark;
      --bg: #141519;
      --panel: #1b1d22;
      --text: #f2f3f5;
      --muted: #9aa0a8;
      --brand: #ff4d24;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    .card { width: 100%; max-width: 380px; }
    .mark { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .mark svg { width: 34px; height: 34px; color: var(--brand); }
    .name { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
    .state { font-size: 14px; color: var(--muted); min-height: 20px; }
    .bar {
      margin-top: 18px;
      height: 4px;
      border-radius: 999px;
      background: #2a2d34;
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--brand);
      transition: width 160ms linear;
    }
    .bar.is-indeterminate span {
      width: 34%;
      animation: sweep 1.1s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    .actions { margin-top: 22px; display: flex; gap: 10px; }
    button {
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
    }
    button.ghost { background: transparent; border-color: #33363d; color: var(--text); }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .note { margin-top: 14px; font-size: 12px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      .bar span { transition: none; }
      .bar.is-indeterminate span { animation: none; width: 100%; opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 100 100" role="img" aria-hidden="true" focusable="false">
        <path d="M50 9 L88 78 Q90 82 85 82 L65 82 L50 56 L35 82 L15 82 Q10 82 12 78 Z" fill="currentColor"/>
      </svg>
      <div>
        <div class="name">Trycord</div>
        <div class="state" id="state" role="status" aria-live="polite">Starting Trycord…</div>
      </div>
    </div>

    <div class="bar" id="bar" hidden><span></span></div>

    <div class="actions">
      <button id="go" type="button">Open Trycord</button>
    </div>
    <p class="note" id="note">An update never keeps you out of your conversations.</p>
  </div>

  <script src="./launcher.js"></script>
</body>
</html>
