<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>.trycord</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="offline-banner" hidden>
    Server offline — start it with <code>npm start</code> in <code>trycord-server</code>, then
    <button id="retry-btn" type="button">retry</button>
  </div>

  <div id="app">
    <!-- Auth -->
    <section id="auth-screen" class="screen card">
      <h1>.trycord</h1>
      <div class="form">
        <h2>Login</h2>
        <input id="login-username" placeholder="username" autocomplete="username" />
        <input id="login-password" type="password" placeholder="password" autocomplete="current-password" />
        <button id="login-btn" type="button">Login</button>
        <p>New here? <button id="show-register" type="button" class="link">Register</button></p>
      </div>
      <div id="register-form" class="form" hidden>
        <h2>Register</h2>
        <input id="reg-username" placeholder="username" autocomplete="username" />
        <input id="reg-password" type="password" placeholder="password (6+ chars)" autocomplete="new-password" />
        <button id="reg-btn" type="button">Register</button>
        <p>Have an account? <button id="show-login" type="button" class="link">Login</button></p>
      </div>
    </section>

    <!-- Join -->
    <section id="join-screen" class="screen card" hidden>
      <h1>Join a server</h1>
      <input id="join-code" placeholder="join code, e.g. lobby" />
      <button id="join-btn" type="button">Look up</button>
      <div id="join-preview" hidden>
        <p><strong id="preview-name"></strong><br /><span id="preview-desc"></span></p>
        <button id="confirm-join" type="button">Join server</button>
      </div>
      <h2>Your servers</h2>
      <ul id="my-servers"></ul>
    </section>

    <!-- Chat -->
    <section id="chat-screen" hidden>
      <aside class="sidebar">
        <div id="server-header">
          <strong id="current-server">-</strong>
          <span>
            <button id="leave-btn" type="button" title="Back to servers">Servers</button>
            <button id="logout-btn" type="button">Logout</button>
          </span>
        </div>
        <div id="channel-list"></div>
      </aside>
      <div class="main">
        <div id="channel-header"># -</div>
        <ul id="message-list"></ul>
        <div id="composer">
          <input id="message-input" placeholder="Type a message…" autocomplete="off" />
          <button id="send-btn" type="button">Send</button>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
