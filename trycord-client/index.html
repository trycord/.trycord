<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Trycord communication client"
  >

  <title>Trycord</title>

  <!-- Application stylesheet -->
  <link rel="stylesheet" href="./css/app.css">
</head>

<body>
  <!-- Keyboard accessibility -->
  <a class="skip-link" href="#trycord-main">
    Skip to main content
  </a>

  <!--
    ============================================================
    TRYCORD APPLICATION
    ============================================================

    IMPORTANT:

    This is the APPLICATION shell.

    This is NOT:
    - the public landing page
    - a dashboard
    - a marketing page
    - a static documentation page

    Do not populate this HTML with mock users, communities,
    channels, messages, or other application data.

    JavaScript must populate these regions from the real
    application state/API/WebSocket system.
  -->

  <div id="app" class="trycord-app">

    <!-- ======================================================
         MOBILE SHELL
         ====================================================== -->

    <section
      id="mobile-shell"
      class="shell shell--mobile"
      aria-label="Trycord mobile application"
      hidden
    >
      <header class="mobile-header">
        <button
          id="mobile-nav-toggle"
          type="button"
          aria-label="Open navigation"
          aria-controls="mobile-navigation"
          aria-expanded="false"
        >
          <span aria-hidden="true">☰</span>
        </button>

        <div
          id="mobile-context"
          class="mobile-context"
        ></div>

        <button
          id="mobile-actions"
          type="button"
          aria-label="Open actions"
        >
          <span aria-hidden="true">•••</span>
        </button>
      </header>

      <aside
        id="mobile-navigation"
        class="mobile-navigation"
        aria-label="Trycord navigation"
        hidden
      ></aside>

      <main
        id="mobile-main"
        class="mobile-main"
      ></main>

      <nav
        id="mobile-tab-navigation"
        class="mobile-tab-navigation"
        aria-label="Primary navigation"
      ></nav>
    </section>


    <!-- ======================================================
         DESKTOP SHELL
         ====================================================== -->

    <section
      id="desktop-shell"
      class="shell shell--desktop"
      aria-label="Trycord desktop application"
      hidden
    >

      <!-- ====================================================
           PRESENCE SPINE

           This is NOT an icon rail.

           It is the persistent spatial navigation environment.
           ==================================================== -->

      <aside
        id="presence-spine"
        class="presence-spine"
        aria-label="Trycord navigation"
      >

        <!-- Authenticated user's real identity -->
        <header
          id="identity-region"
          class="presence-spine__identity"
        ></header>

        <!-- Global destinations:
             Home / DMs / other real application destinations -->
        <nav
          id="global-navigation"
          class="presence-spine__global-navigation"
          aria-label="Global navigation"
        ></nav>

        <!-- Real communities belonging to the authenticated user -->
        <section
          id="community-navigation"
          class="presence-spine__communities"
          aria-label="Communities"
        ></section>

        <!-- Contextual navigation for the currently selected
             community/place -->
        <section
          id="place-navigation"
          class="presence-spine__place-navigation"
          aria-label="Current place navigation"
        ></section>

      </aside>


      <!-- ====================================================
           MAIN ENVIRONMENT / ATRIUM
           ==================================================== -->

      <main
        id="trycord-main"
        class="main-environment"
      >

        <!--
          Context belongs INSIDE the environment.

          This is not a permanent application-wide top bar.
          It changes according to the current place.
        -->
        <header
          id="context-header"
          class="context-header"
        ></header>

        <!--
          Primary application viewport.

          JavaScript renders the currently active real
          application surface here.
        -->
        <section
          id="view-root"
          class="view-root"
          aria-live="polite"
        ></section>

      </main>

    </section>


    <!-- ======================================================
         GLOBAL OVERLAYS
         ======================================================

         These are intentionally outside the shells so they can
         be used by both desktop and mobile.
    -->

    <div
      id="modal-root"
      class="modal-root"
      aria-live="assertive"
    ></div>

    <div
      id="popover-root"
      class="popover-root"
    ></div>

    <div
      id="toast-root"
      class="toast-root"
      aria-live="polite"
      aria-atomic="true"
    ></div>


    <!-- ======================================================
         APPLICATION STATUS
         ====================================================== -->

    <div
      id="connection-status"
      class="connection-status"
      role="status"
      aria-live="polite"
    ></div>

  </div>


  <!--
    ============================================================
    APPLICATION JAVASCRIPT
    ============================================================

    Keep application logic in JS modules.

    The HTML above is the structural shell only.

    Do not put:
    - fake data
    - example communities
    - example messages
    - fake users
    - fake channels
    - fake API responses

    into this document.
  -->

  <script type="module" src="./js/app.js"></script>
</body>
</html>
